<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,500&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>

:root{--bg:#f6f0e4;--panel:#fffaf0;--ink:#2a2a2d;--muted:#66625b;--line:#ddd2bd;--red:#7a1f2b;--red-ink:#fff7ec;--soft:#ecdcc6;
--serif:"Playfair Display",Georgia,serif;--sans:"Source Sans 3","Segoe UI",Arial,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1a1b;--panel:#262324;--ink:#f1e9da;--muted:#b3a99a;--line:#3d3639;--red:#e08a93;--red-ink:#1c1a1b;--soft:#3a2a2d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1a1b;--panel:#262324;--ink:#f1e9da;--muted:#b3a99a;--line:#3d3639;--red:#e08a93;--red-ink:#1c1a1b;--soft:#3a2a2d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.05rem/1.65 var(--sans)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.w{max-width:1040px;margin:0 auto;padding:0 20px}
.top{background:var(--red);color:var(--red-ink);font-size:.85rem;text-align:center;padding:6px 12px}
nav{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0;font-weight:600}
nav b{font:800 1.05rem var(--serif);letter-spacing:.04em}
nav .l{display:flex;gap:16px;flex-wrap:wrap;font-size:.9rem}
nav a{color:var(--muted);text-decoration:none}nav a:hover{color:var(--red)}
.th{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 12px;font-size:.8rem}
h1,h2,h3{font-family:var(--serif);line-height:1.1;margin:0}
h1{font-weight:800;font-size:clamp(2.4rem,7vw,4.8rem);letter-spacing:-.02em}
h2{font-weight:800;font-size:clamp(1.8rem,4.5vw,2.8rem);margin-bottom:8px}
h2 small{display:block;font:italic 500 1.1rem var(--serif);color:var(--red);margin-top:6px}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:32px;align-items:center;padding:28px 0 64px}
.kick{text-transform:uppercase;letter-spacing:.18em;font-size:.78rem;font-weight:700;color:var(--red);margin:0 0 12px}
.sub{font:italic 500 1.2rem/1.5 var(--serif);margin:18px 0 8px}
.sub2{color:var(--muted);margin:0 0 24px}
.btn{display:inline-block;background:var(--red);color:var(--red-ink);border-radius:99px;padding:12px 24px;font-weight:700;text-decoration:none;margin:0 8px 8px 0;border:2px solid var(--red)}
.btn.o{background:transparent;color:var(--red)}
section{padding:56px 0;border-top:1px solid var(--line)}
.lead{color:var(--muted);max-width:62ch;margin:8px 0 26px}
.quote{font:italic 500 clamp(1.2rem,3vw,1.7rem)/1.4 var(--serif);max-width:30ch;margin:20px 0 0;color:var(--red)}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:22px}
.card h3{font-size:1.35rem;margin-bottom:6px}.card p{margin:0;color:var(--muted)}
.num{font:800 2.4rem var(--serif);color:var(--red);opacity:.5}
.mapw{display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:start}
svg.map{width:100%;height:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px}
.bg{fill:var(--soft);stroke:var(--red);stroke-width:1.5}
.ln{stroke:var(--red);stroke-width:1.2;stroke-dasharray:4 4;fill:none;opacity:.7}
.hero .ln{stroke-dasharray:300;stroke-dashoffset:300;animation:dr 2.4s ease forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.pt{fill:var(--red);cursor:pointer;transition:r .2s}
.pt.on{stroke:var(--ink);stroke-width:2}
.pt:hover{r:9}
.pl{font:600 11px var(--sans);fill:var(--ink);pointer-events:none}
.pn{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--red);border-radius:6px;padding:22px;min-height:230px}
.pn h3{font-size:1.5rem;margin-bottom:4px}
.tag{display:inline-block;background:var(--soft);border-radius:4px;padding:2px 10px;font-size:.78rem;font-weight:700;margin-bottom:10px}
.pn dt{font-weight:700;color:var(--red);font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;margin-top:12px}
.pn dd{margin:0}
.ph{background:var(--soft);border:1px dashed var(--red);border-radius:4px;padding:1px 8px;font-size:.92rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 24px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:5px 14px;font-size:.92rem}
.tl{border-left:3px solid var(--red);margin-left:10px;padding-left:28px}
.st{position:relative;padding-bottom:22px;opacity:0;transform:translateY(14px);transition:.6s}
.st.in{opacity:1;transform:none}
.st::before{content:attr(data-n);position:absolute;left:-47px;top:0;width:32px;height:32px;border-radius:50%;background:var(--red);color:var(--red-ink);display:grid;place-items:center;font:700 .9rem var(--sans)}
.st h3{font-size:1.15rem;font-family:var(--sans);font-weight:700}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.tab{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:8px 16px;font-weight:600}
.tab:hover{border-color:var(--red)}
.tab[aria-pressed="true"]{background:var(--red);color:var(--red-ink);border-color:var(--red)}
.rg{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.rc{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px}
.rc b{display:block;font:800 1.1rem var(--serif)}.rc span{color:var(--muted);font-size:.9rem}
.rc[aria-pressed="true"]{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.post{font-style:italic;border-left:3px solid var(--red);padding-left:12px;margin-top:6px}
.mk{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;align-items:start}
.mk figure{margin:0}.mk figcaption{font-size:.82rem;color:var(--muted);margin-top:8px}
.sc{background:linear-gradient(160deg,#7a1f2b,#2a2a2d);color:#fff7ec;border-radius:18px;aspect-ratio:9/16;padding:16px;display:flex;flex-direction:column;justify-content:flex-end;max-width:210px;position:relative}
.sc .pl2{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;border:2px solid #fff7ec;display:grid;place-items:center}
.sc b{font:800 1.2rem var(--serif)}.sc small{opacity:.85}
.car{display:flex;gap:6px;overflow-x:auto}
.car div{flex:0 0 150px;aspect-ratio:1;background:var(--red);color:var(--red-ink);border-radius:6px;padding:12px;font:700 .95rem var(--serif);display:flex;align-items:flex-end}
.car div:nth-child(2){background:var(--ink);color:var(--bg)}.car div:nth-child(3){background:var(--soft);color:var(--ink)}
.fb,.bp{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
.fb .d{display:inline-block;background:var(--red);color:var(--red-ink);border-radius:4px;padding:2px 10px;font-weight:700;font-size:.8rem}
.fb button{margin-top:8px;border:1px solid var(--line);border-radius:6px;padding:6px 14px;background:var(--bg)}
.bp p{margin:0 0 8px;font-size:.95rem}.bp hr{border:0;border-top:1px solid var(--line)}
.poll button{display:block;width:100%;margin-top:8px;border:2px solid #fff7ec;background:transparent;color:#fff7ec;border-radius:99px;padding:8px}
.poll button[aria-pressed="true"]{background:#fff7ec;color:#7a1f2b}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kp div{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;font-weight:600}
.kp i{display:block;font:800 1.3rem var(--serif);color:var(--red);font-style:normal}
.au{display:grid;grid-template-columns:240px 1fr;gap:32px;align-items:center}
.au img{width:100%;height:auto;display:block}
.fin{text-align:center;padding:80px 0;background:var(--red);color:var(--red-ink);border:0}
.fin h2{font-size:clamp(2.2rem,7vw,4.4rem);margin:0}
.fin p{font:italic 500 clamp(1.3rem,4vw,2.2rem) var(--serif);margin:8px 0 0}
footer{font-size:.82rem;color:var(--muted);text-align:center;padding:24px 20px}
.rv{opacity:0;transform:translateY(16px);transition:.7s}.rv.in{opacity:1;transform:none}
@media (max-width:820px){.hero,.mapw,.au{grid-template-columns:1fr}.g3,.rg{grid-template-columns:1fr}.kp{grid-template-columns:repeat(2,1fr)}.au img{max-width:200px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}.rv,.st{opacity:1;transform:none}.hero .ln{stroke-dashoffset:0}}

.big{font:800 clamp(3rem,10vw,6rem)/1 var(--serif);color:var(--red);letter-spacing:-.03em}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:24px 0}
.shots{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}
.shots figure{margin:0}.shots img{display:block;width:100%;height:auto;border-radius:14px;border:1px solid var(--line)}
.shots figcaption{font-size:.82rem;color:var(--muted);margin-top:6px}
.lg{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 12px;font-size:.8rem;font-weight:700}
.pn ul{margin:6px 0 0;padding-left:20px}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.tm{font-weight:700;color:var(--red)}
.two{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:820px){.facts,.shots,.mini,.two{grid-template-columns:1fr}.shots figure{max-width:260px}}
</style>
</head>

const LL=[[22.4,44.0],[23.2,43.8],[24,43.7],[25.3,43.6],[26,43.85],[27.25,44.12],[28.6,43.7],[28.47,43.37],[27.95,43.2],[27.9,42.7],[27.5,42.5],[28.0,42.0],[27.0,42.0],[26.2,41.75],[26.1,41.4],[25.4,41.3],[24.7,41.4],[23.7,41.4],[23.0,41.4],[22.9,41.35],[22.7,42.0],[22.4,42.3],[22.5,42.9],[22.4,43.8]];
const P=([x,y])=>[((x-22.3)*73+6).toFixed(0),((44.3-y)*100+6).toFixed(0)];
const poly=LL.map(p=>P(p).join(",")).join(" ");
const SOF=[23.32,42.7];
function map(el,interactive){
 const s=P(SOF);
 let h=`<svg class="map" viewBox="0 0 480 320" role="img" aria-label="Карта на България"><polygon class="bg" points="${poly}"/>`;
 CT.forEach((c,i)=>{const q=P(c.p);h+=`<path class="ln" style="animation-delay:${i*.3}s" d="M${s[0]} ${s[1]} Q${(+s[0]+ +q[0])/2} ${Math.min(s[1],q[1])-30} ${q[0]} ${q[1]}"/>`});
 h+=`<circle cx="${s[0]}" cy="${s[1]}" r="5" fill="none" stroke="var(--red)" stroke-width="2"/><text class="pl" x="${s[0]-34}" y="${+s[1]-10}">София</text>`;
 CT.forEach((c,i)=>{const q=P(c.p);
  h+=`<circle class="pt" r="${c.pilot?8:6}" cx="${q[0]}" cy="${q[1]}" ${interactive?`tabindex="0" role="button" aria-label="${c.n}" data-i="${i}"`:""}/><text class="pl" x="${+q[0]+10}" y="${+q[1]+4}">${c.n}</text>`});
 el.innerHTML=h+"</svg>";
}
